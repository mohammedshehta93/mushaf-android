name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Quran data (fonts, layout, tafsir, meanings) is downloaded once and cached.
      - name: Cache Quran sources
        uses: actions/cache@v4
        with:
          path: .data-cache
          key: quran-data-${{ hashFiles('tools/*.py') }}

      - name: Prepare & verify Quran data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/prepare_data.py .data-cache app/src/main/assets/quran

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Decode release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add the release key secrets (see README) — a release is never signed with a debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon assembleDebug

      - name: Verify signature fingerprint
        if: github.event_name != 'pull_request'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 "SHA-256 digest" certs.txt | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')
          WANT=$(tr -d ' :\n' < signing/release-cert-sha256.txt | tr 'A-F' 'a-f')
          echo "signed with: $GOT"; echo "expected:    $WANT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::APK is not signed with the official release key"; exit 1; fi
          VC=$((100 + BUILD_NUMBER))
          cp "$APK" "mushaf-$VC.apk"
          echo "APK_FILE=mushaf-$VC.apk" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$BUILD_NUMBER" >> "$GITHUB_ENV"
          ls -la "mushaf-$VC.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: mushaf-apk
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub release (in-app update source)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%s)
          gh release create "v$VERSION_NAME" "$APK_FILE" \
            --title "المصحف $VERSION_NAME" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" --latest
