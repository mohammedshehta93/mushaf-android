name: Web (iPhone) version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .data-cache
          key: quran-data-${{ hashFiles('tools/*.py') }}
      - name: Prepare & verify Quran data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/prepare_data.py .data-cache assets-out
      - name: Build web site
        run: python3 tools/build_web.py .data-cache assets-out site "${{ github.run_number }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
